name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted, run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -timeout 10m ./...

      - name: Smoke-test the benchmarks
        run: go test -run '^$' -bench 'Pipeline/(sequential|workers=2)$' -benchtime 1x ./internal/pipeline